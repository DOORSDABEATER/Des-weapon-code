
name: Build Azrathiel

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract v1.1 source
        run: |
          unzip -q azrathiel-source-v1.1.zip -d source
          test -f source/azrathiel/pom.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: source/azrathiel/pom.xml

      - name: Compile
        run: mvn -B -f source/azrathiel/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Azrathiel-v1.1
          path: source/azrathiel/target/*.jar
          if-no-files-found: error
          
