
name: Build Azrathiel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q azrathiel-source-v1.0.zip -d source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: source/azrathiel/pom.xml

      - name: Build plugin
        run: mvn -B -f source/azrathiel/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Azrathiel-Plugin
          path: source/azrathiel/target/*.jar
          if-no-files-found: error
          
